<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Monitor</title>
<style>
:root{--bg:#050b13;--panel:rgba(13,27,42,.72);--panel2:rgba(9,20,32,.88);--line:rgba(148,184,220,.14);--line2:rgba(148,184,220,.24);
--text:#eaf6ff;--muted:#7f97ac;--accent:#5ad1f0;--accent2:#2dd4bf;--ok:#3ddc97;--err:#ff6b81;--warn:#ffc46b;--r:18px;--gap:14px;
--cols:36px minmax(0,2.2fr) minmax(120px,1fr) 84px 84px 72px 100px 66px 118px}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Inter,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--text);background:var(--bg);
background-image:radial-gradient(1100px 500px at 85% -10%,rgba(90,209,240,.09),transparent 60%),radial-gradient(900px 460px at -10% 110%,rgba(45,212,191,.07),transparent 60%);font-size:14px}
.shell{max-width:1400px;margin:0 auto;padding:26px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,rgba(90,209,240,.22),rgba(45,212,191,.16));border:1px solid rgba(90,209,240,.35)}
.brand h1{font-size:1.25rem;letter-spacing:-.02em}.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{color:var(--muted);font-size:.78rem;margin-top:3px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:12px;font-weight:600;cursor:pointer;transition:.15s;font-size:.84rem}
.btn:hover{border-color:rgba(90,209,240,.5);background:rgba(90,209,240,.08)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04222f;border:none}
.btn.warm{background:linear-gradient(135deg,var(--warn),#ff9a5b);color:#3a2105;border:none}
.btn.danger{background:linear-gradient(135deg,var(--err),#ff8f6b);color:#3a0510;border:none}
.btn:disabled{opacity:.6;cursor:wait}
.pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.76rem;color:var(--muted)}
.pill.busy{color:var(--warn);border-color:rgba(255,196,107,.4)}
.pwrap{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.pwrap.hidden{display:none}
.ptrack{flex:1;height:6px;border-radius:99px;background:rgba(148,184,220,.12);overflow:hidden}
.pbar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;box-shadow:0 0 12px rgba(90,209,240,.5)}
#ptext{font-size:.76rem;color:var(--warn);font-weight:700;min-width:90px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.card .ic.b{background:rgba(90,209,240,.14)}.card .ic.g{background:rgba(61,220,151,.14)}.card .ic.s{background:rgba(45,212,191,.14)}.card .ic.r{background:rgba(255,107,129,.12)}
.card b{font-size:1.5rem;display:block;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:.76rem}
.card.ok b{color:var(--ok)}.card.q b{color:var(--accent)}.card.off b{color:var(--err)}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.deckrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:rgba(90,209,240,.12);border-color:rgba(90,209,240,.35)}
.grow{flex:1}
.in{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:.82rem;outline:none}
.in:focus{border-color:rgba(90,209,240,.5)}
#fSearch{width:200px}
.flabel{color:var(--muted);font-size:.76rem;font-weight:700}
.listhead,.row{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center}
.listhead{padding:0 18px 10px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.08em}
.listhead .r,.num{text-align:right}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--line2);transform:translateY(-1px)}
.row.quality{border-color:rgba(61,220,151,.4);box-shadow:inset 3px 0 0 var(--ok)}
.row.offline{opacity:.75}
.sel{display:flex;align-items:center;justify-content:center}
.sel input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;cursor:pointer;opacity:0;transition:.15s;margin:0;flex:none}
.sel input:hover{border-color:var(--accent)}
.sel input:checked{opacity:1;background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--panel2)}
.row:hover .sel input,.list.selecting .sel input{opacity:1}
.listhead .sel input{opacity:.85}
.main{display:flex;align-items:flex-start;gap:12px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.off{background:var(--err)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}50%{box-shadow:0 0 0 6px rgba(61,220,151,0)}}
.who{min-width:0;flex:1}
.who>b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subline{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.llabel{font-style:normal;color:var(--muted);font-size:.66rem;letter-spacing:.03em;flex:none}
.kv{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.kv em{font-style:normal;color:var(--muted);font-size:.66rem;letter-spacing:.03em;flex:none}
.kv b{color:#d9edfb;font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv b.colo{color:var(--accent)}
.kv b.time{color:var(--muted);font-weight:600}
.kv b.err{color:var(--err) !important;font-weight:800}
/* 🌟 v26: 来源直接显示具体值（省略号+悬浮全文） */
.srcval{color:#c9f3ff;font-size:.74rem;font-weight:700;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:20px}
.bars i{width:6px;height:16px;border-radius:2px;cursor:pointer;transition:.15s}
.bars i:hover{transform:scaleY(1.25)}
.bars i.g{background:var(--ok)}.bars i.w{background:var(--warn)}.bars i.r{background:var(--err)}.bars i.f{background:rgba(148,184,220,.16)}
.num{font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.num i{font-style:normal;color:var(--muted);font-size:.68rem;margin-left:2px}
.num small{display:block;color:var(--muted);font-weight:400;font-size:.66rem}
.rate{font-weight:800;font-size:.86rem;text-align:right;font-variant-numeric:tabular-nums}
.rate.g{color:var(--ok)}.rate.w{color:var(--warn)}.rate.r{color:var(--err)}
.statcell{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;opacity:0;transition:.15s;font-size:.85rem}
.row:hover .iconbtn{opacity:1}
.iconbtn:hover{color:var(--text);border-color:rgba(90,209,240,.5)}
.badge{padding:6px 11px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
.badge.q{background:rgba(61,220,151,.14);color:#b8f5da;border:1px solid rgba(61,220,151,.3)}
.badge.on{background:rgba(90,209,240,.1);color:#c9f3ff;border:1px solid rgba(90,209,240,.25)}
.badge.off{background:rgba(255,107,129,.1);color:#ffd3da;border:1px solid rgba(255,107,129,.25)}
.mode{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.66rem;font-weight:800;margin-right:6px}
.mode.manual{background:rgba(255,196,107,.15);color:var(--warn)}
.mode.auto{background:rgba(148,184,220,.12);color:var(--muted)}
.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
footer{margin-top:24px;text-align:center;color:var(--muted);font-size:.74rem;line-height:1.9}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:.74rem;font-weight:600;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tip.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(2,6,11,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.hidden{display:none}
.modal{width:min(820px,100%);max-height:86vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:24px}
.console{background:#04090f;border:1px solid var(--line);border-radius:12px;padding:14px;height:56vh;overflow:auto;font:11.5px/1.8 ui-monospace,monospace;color:#9fd8e8}
.console div span{color:var(--muted);margin-right:8px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mtab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted)}
.mtab.on{color:var(--text);border-color:rgba(90,209,240,.4);background:rgba(90,209,240,.1)}
.mbody.hidden{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.76rem;font-weight:700}
.grid2 input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:.86rem;outline:none}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
textarea#ipText{width:100%;min-height:260px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font:12px/1.7 ui-monospace,monospace;outline:none}
.help h2{font-size:1.05rem;margin:18px 0 8px;color:var(--accent)}
.help p,.help li{font-size:.84rem;color:var(--muted);line-height:1.8}
.help ul{padding-left:20px}
.help code{background:rgba(90,209,240,.1);color:var(--accent);padding:1px 6px;border-radius:6px;font-size:.78rem}
.help table{width:100%;border-collapse:collapse;margin:8px 0}
.help th,.help td{border:1px solid var(--line);padding:6px 8px;font-size:.78rem;text-align:left;color:var(--muted)}
.help th{color:var(--text)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid rgba(90,209,240,.35);border-radius:999px;padding:12px 18px;font-weight:700;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{border-color:rgba(255,107,129,.4);color:#ffd3da}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.listhead{display:none}.row{grid-template-columns:36px 1fr 1fr;gap:8px}.colhide{display:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <div class="logo">📡</div>
      <div><h1>Proxy <em>Monitor</em></h1><p>延迟 / 带宽长期监测 · 配置-节点解耦 · 优质筛选 · GitHub 同步</p></div>
    </div>
    <div class="acts">
      <span class="pill" id="cycleInfo">--</span>
      <button class="btn" id="btnHelp">📖 手册</button>
      <button class="btn" id="btnLogs">📜 日志</button>
      <button class="btn" id="btnSettings">⚙️ 设置</button>
      <button class="btn primary" id="btnCheck">⚡ 立即检测</button>
      <button class="btn warm" id="btnUpload">📤 上传优质节点</button>
    </div>
  </div>

  <div class="pwrap hidden" id="pwrap"><div class="ptrack"><div class="pbar" id="pbar"></div></div><span id="ptext"></span></div>
  <section class="cards" id="cards"></section>

  <section class="deck">
    <div class="deckrow">
      <div class="tabs" id="tabs"></div>
      <span class="grow"></span>
      <button class="btn danger" id="btnRemove" style="display:none">🗑️ 删除所选 (0)</button>
      <span class="flabel">排序</span>
      <select class="in" id="sortBy"><option value="tls">TLS 升序</option><option value="speed">速度降序</option><option value="rate">成功率降序</option></select>
      <button class="btn primary" id="btnCopy">📋 复制筛选节点</button>
    </div>
    <div class="deckrow">
      <input class="in" id="fSearch" type="text" placeholder="🔍 搜索 IP / 来源 / 数据中心 / 地区">
      <span class="flabel">来源</span>
      <select class="in" id="fSrcKind"><option value="">全部</option><option value="pure">配置文件IP</option><option value="dom">域名解析</option><option value="url">远程链接</option></select>
      <span class="flabel">TLS ≤</span><input class="in" id="fTls" type="number" placeholder="ms" style="width:80px">
      <span class="flabel">速度 ≥</span><input class="in" id="fSpeed" type="number" placeholder="KB/s" style="width:86px">
      <span class="flabel">成功率 ≥</span><input class="in" id="fRate" type="number" placeholder="%" style="width:70px">
      <span class="flabel">数据中心</span><select class="in" id="fColo"><option value="">全部</option></select>
      <span class="flabel">地区</span><select class="in" id="fLoc"><option value="">全部</option></select>
      <button class="btn" id="fReset">重置</button>
      <span class="grow"></span>
      <span class="pill" id="filterCount"></span>
      <span class="pill" id="cfgInfo"></span>
    </div>
  </section>

  <div class="listhead"><span class="sel"><input type="checkbox" id="selectAll" title="全选/取消当前筛选结果"></span><span>节点 (IP)</span><span id="barsHead">近 10 次状态</span><span class="r">TLS 平均</span><span class="r colhide">TLS 最新</span><span class="r colhide">TCP 最新</span><span class="r">平均速度</span><span class="r">成功率</span><span class="r">状态</span></div>
  <section class="list" id="list"></section>
  <footer>Proxy Monitor <span id="ver"></span> · 配置只负责发现 / 节点只负责监测 · 来源=首次引入(直接显示具体值) · 📖 手册</footer>
</div>

<div id="tip"></div>
