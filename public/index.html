<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Monitor</title>
<style>
:root{--bg:#050b13;--panel:rgba(13,27,42,.72);--panel2:rgba(9,20,32,.88);--line:rgba(148,184,220,.14);--line2:rgba(148,184,220,.24);
--text:#eaf6ff;--muted:#7f97ac;--accent:#5ad1f0;--accent2:#2dd4bf;--ok:#3ddc97;--err:#ff6b81;--warn:#ffc46b;--r:18px;--gap:14px;
--cols:minmax(0,2.2fr) minmax(120px,1fr) 84px 84px 72px 100px 66px 118px}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Inter,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--text);background:var(--bg);
background-image:radial-gradient(1100px 500px at 85% -10%,rgba(90,209,240,.09),transparent 60%),radial-gradient(900px 460px at -10% 110%,rgba(45,212,191,.07),transparent 60%);font-size:14px}
.shell{max-width:1360px;margin:0 auto;padding:26px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,rgba(90,209,240,.22),rgba(45,212,191,.16));border:1px solid rgba(90,209,240,.35)}
.brand h1{font-size:1.25rem;letter-spacing:-.02em}.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{color:var(--muted);font-size:.78rem;margin-top:3px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:12px;font-weight:600;cursor:pointer;transition:.15s;font-size:.84rem}
.btn:hover{border-color:rgba(90,209,240,.5);background:rgba(90,209,240,.08)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04222f;border:none}
.btn.warm{background:linear-gradient(135deg,var(--warn),#ff9a5b);color:#3a2105;border:none}
.btn:disabled{opacity:.6;cursor:wait}
.pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.76rem;color:var(--muted)}
.pill.busy{color:var(--warn);border-color:rgba(255,196,107,.4)}
.pwrap{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.pwrap.hidden{display:none}
.ptrack{flex:1;height:6px;border-radius:99px;background:rgba(148,184,220,.12);overflow:hidden}
.pbar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;box-shadow:0 0 12px rgba(90,209,240,.5)}
#ptext{font-size:.76rem;color:var(--warn);font-weight:700;min-width:90px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.card .ic.b{background:rgba(90,209,240,.14)}.card .ic.g{background:rgba(61,220,151,.14)}.card .ic.s{background:rgba(45,212,191,.14)}.card .ic.r{background:rgba(255,107,129,.12)}
.card b{font-size:1.5rem;display:block;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:.76rem}
.card.ok b{color:var(--ok)}.card.q b{color:var(--accent)}.card.off b{color:var(--err)}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.deckrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:rgba(90,209,240,.12);border-color:rgba(90,209,240,.35)}
.grow{flex:1}
.in{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:.82rem;outline:none}
.in:focus{border-color:rgba(90,209,240,.5)}
#fSearch{width:200px}
.flabel{color:var(--muted);font-size:.76rem;font-weight:700}
.listhead,.row{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center}
.listhead{padding:0 18px 10px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.08em}
.listhead .r,.num{text-align:right}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--line2);transform:translateY(-1px)}
.row.quality{border-color:rgba(61,220,151,.4);box-shadow:inset 3px 0 0 var(--ok)}
.row.offline{opacity:.7}
.main{display:flex;align-items:center;gap:12px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.off{background:var(--err)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}50%{box-shadow:0 0 0 6px rgba(61,220,151,0)}}
.who{min-width:0;flex:1}
.who b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subline{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:5px}
.kv{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.kv em{font-style:normal;color:var(--muted);font-size:.66rem;letter-spacing:.03em}
.kv b{color:#d9edfb;font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv b.colo{color:var(--accent)}
.kv b.time{color:var(--muted);font-weight:600}
.kv b.err{color:var(--err) !important;font-weight:800}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:20px}
.bars i{width:6px;height:16px;border-radius:2px;cursor:pointer;transition:.15s}
.bars i:hover{transform:scaleY(1.25)}
.bars i.g{background:var(--ok)}.bars i.w{background:var(--warn)}.bars i.r{background:var(--err)}.bars i.f{background:rgba(148,184,220,.16)}
.num{font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.num i{font-style:normal;color:var(--muted);font-size:.68rem;margin-left:2px}
.num small{display:block;color:var(--muted);font-weight:400;font-size:.66rem}
.rate{font-weight:800;font-size:.86rem;text-align:right;font-variant-numeric:tabular-nums}
.rate.g{color:var(--ok)}.rate.w{color:var(--warn)}.rate.r{color:var(--err)}
.statcell{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;opacity:0;transition:.15s;font-size:.85rem}
.row:hover .iconbtn{opacity:1}
.iconbtn:hover{color:var(--text);border-color:rgba(90,209,240,.5)}
.badge{padding:6px 11px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
.badge.q{background:rgba(61,220,151,.14);color:#b8f5da;border:1px solid rgba(61,220,151,.3)}
.badge.on{background:rgba(90,209,240,.1);color:#c9f3ff;border:1px solid rgba(90,209,240,.25)}
.badge.off{background:rgba(255,107,129,.1);color:#ffd3da;border:1px solid rgba(255,107,129,.25)}
.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
footer{margin-top:24px;text-align:center;color:var(--muted);font-size:.74rem;line-height:1.9}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:.74rem;font-weight:600;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tip.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(2,6,11,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.hidden{display:none}
.modal{width:min(760px,100%);max-height:86vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:24px}
.console{background:#04090f;border:1px solid var(--line);border-radius:12px;padding:14px;height:56vh;overflow:auto;font:11.5px/1.8 ui-monospace,monospace;color:#9fd8e8}
.console div span{color:var(--muted);margin-right:8px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mtabs{display:flex;gap:8px;margin-bottom:16px}
.mtab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted)}
.mtab.on{color:var(--text);border-color:rgba(90,209,240,.4);background:rgba(90,209,240,.1)}
.mbody.hidden{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.76rem;font-weight:700}
.grid2 input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:.86rem;outline:none}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
textarea#ipText{width:100%;min-height:260px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font:12px/1.7 ui-monospace,monospace;outline:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid rgba(90,209,240,.35);border-radius:999px;padding:12px 18px;font-weight:700;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{border-color:rgba(255,107,129,.4);color:#ffd3da}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.listhead{display:none}.row{grid-template-columns:1fr 1fr;gap:8px}.colhide{display:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <div class="logo">📡</div>
      <div><h1>Proxy <em>Monitor</em></h1><p>延迟 / 带宽长期监测 · 域名全 IPv4 展开 · 优质筛选 · GitHub 同步</p></div>
    </div>
    <div class="acts">
      <span class="pill" id="cycleInfo">--</span>
      <button class="btn" id="btnLogs">📜 日志</button>
      <button class="btn" id="btnSettings">⚙️ 设置</button>
      <button class="btn primary" id="btnCheck">⚡ 立即检测</button>
      <button class="btn warm" id="btnUpload">📤 上传优质节点</button>
    </div>
  </div>

  <div class="pwrap hidden" id="pwrap"><div class="ptrack"><div class="pbar" id="pbar"></div></div><span id="ptext"></span></div>

  <section class="cards" id="cards"></section>

  <section class="deck">
    <div class="deckrow">
      <div class="tabs" id="tabs"></div>
      <span class="grow"></span>
      <span class="flabel">排序</span>
      <select class="in" id="sortBy"><option value="tls">TLS 升序</option><option value="speed">速度降序</option><option value="rate">成功率降序</option></select>
      <button class="btn primary" id="btnCopy">📋 复制筛选节点</button>
    </div>
    <div class="deckrow">
      <input class="in" id="fSearch" type="text" placeholder="🔍 搜索 名称 / IP / 数据中心 / 地区">
      <span class="flabel">TLS ≤</span><input class="in" id="fTls" type="number" placeholder="ms" style="width:80px">
      <span class="flabel">速度 ≥</span><input class="in" id="fSpeed" type="number" placeholder="KB/s" style="width:86px">
      <span class="flabel">成功率 ≥</span><input class="in" id="fRate" type="number" placeholder="%" style="width:70px">
      <span class="flabel">数据中心</span><select class="in" id="fColo"><option value="">全部</option></select>
      <span class="flabel">地区</span><select class="in" id="fLoc"><option value="">全部</option></select>
      <button class="btn" id="fReset">重置</button>
      <span class="grow"></span>
      <span class="pill" id="filterCount"></span>
      <span class="pill" id="cfgInfo"></span>
    </div>
  </section>

  <div class="listhead"><span>节点</span><span id="barsHead">近 10 次状态</span><span class="r">TLS 中位</span><span class="r colhide">TLS 最新</span><span class="r colhide">TCP</span><span class="r">速度</span><span class="r">成功率</span><span class="r">状态</span></div>
  <section class="list" id="list"></section>
  <footer>状态条：🟩达标 🟥未达标(失败/超延迟/低速) · 悬浮查看单次明细<br>
  数据中心 = Cloudflare 接入机房(colo) · 地区 = 节点出口地区(loc) · 出口 = 代理出口IP · 优质 = 窗口内每次检测均达标</footer>
</div>

<div id="tip"></div>

<div id="logPanel" class="overlay hidden">
  <div class="modal">
    <div class="mhead"><h2>📜 运行日志</h2><button class="btn" id="logClose">✕</button></div>
    <div class="console" id="console"></div>
  </div>
</div>

<div id="modal" class="overlay hidden">
  <div class="modal">
    <div class="mhead"><h2>⚙️ 设置</h2><button class="btn" id="mClose">✕</button></div>
    <div class="mtabs"><span class="mtab on" data-mtab="cfg">运行配置</span><span class="mtab" data-mtab="ips">节点列表 ip.txt</span></div>
    <div id="mCfg" class="mbody">
      <div class="grid2">
        <label>监测间隔(秒)<input id="cInterval" type="number"></label>
        <label>单次超时(秒)<input id="cTimeout" type="number"></label>
        <label>并发数<input id="cConcurrency" type="number"></label>
        <label>官方探针 URL<input id="cProbe" type="text"></label>
        <label>🌟 自定义终极探针 URL<input id="cCustomProbe" type="text" placeholder="https://your-domain.com/generate_204"></label>
        <label>域名 DNS 查询间隔(秒)<input id="cDnsTtl" type="number"></label>
        <label>已发现 IP 保留(小时)<input id="cRetain" type="number"></label>
        <label>优质 TLS 上限(ms,0=不限)<input id="cMaxTls" type="number"></label>
        <label>优质速度下限(KB/s,0=不限)<input id="cMinSpeed" type="number"></label>
        <label>优质判定窗口(次)<input id="cWindow" type="number"></label>
        <label>达标率阈值(0-1, 1=每次都必须达标)<input id="cRate" type="number" step="0.05"></label>
        <label>GitHub Token<input id="cGhToken" type="password" placeholder="ghp_xxxx"></label>
        <label>GitHub 仓库(owner/repo)<input id="cGhRepo" type="text"></label>
        <label>上传文件路径<input id="cGhPath" type="text"></label>
        <label>分支<input id="cGhBranch" type="text"></label>
      </div>
      <div class="grid2" style="margin-top:12px"><label style="flex-direction:row;align-items:center;gap:8px"><input id="cGhAuto" type="checkbox" style="width:auto"> 优质列表变化时自动上传 GitHub</label></div>
      <div class="mfoot"><button class="btn primary" id="saveCfg">💾 保存配置</button></div>
    </div>
    <div id="mIps" class="mbody hidden">
      <textarea id="ipText" spellcheck="false"></textarea>
      <div class="mfoot"><button class="btn primary" id="saveIps">💾 保存并重载节点</button></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var STATE=null,TAB='all',LAST_VIEW=[];
function el(id){return document.getElementById(id);}
function esc(v){v=String(v==null?'':v);return v.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function fmtT(ts){return ts?new Date(ts).toLocaleTimeString():'--';}
function fmtDT(ts){ if(!ts)return '--'; var d=new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function flag(cc){ if(!cc||cc.length!==2)return ''; cc=cc.toUpperCase();
  var A=0x1F1E6; try{return String.fromCodePoint(A+cc.charCodeAt(0)-65,A+cc.charCodeAt(1)-65);}catch(e){return '';} }
var toastTimer=null;
function toast(m,e){var t=el('toast');t.innerText=m;t.className=e?'show err':'show';if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2600);}
function copyText(t){ if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise(function(res){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);res();}); }
function load(){ return fetch('/api/state').then(function(r){return r.json();}).then(function(s){STATE=s;render();})
  .catch(function(e){var c=el('cycleInfo');c.textContent='加载失败: '+e.message;}); }

function cfgNum(k,d){ return (STATE&&STATE.config&&STATE.config[k]!=null)?STATE.config[k]:d; }
function pointGood(p){
  var H=cfgNum('maxTlsMs',0), S=cfgNum('minSpeedKBps',0);
  if(!p.ok)return false;
  if(H>0&&(p.tls==null||p.tls>H))return false;
  if(S>0&&(p.speed==null||p.speed<S))return false;
  return true;
}
function barsHtml(recent){
  var N=cfgNum('qualityWindow',10);
  var rec=(recent||[]).slice(-N);
  if(!rec.length)return '<span style="color:var(--muted)">--</span>';
  var H=cfgNum('maxTlsMs',0)||800;
  return '<span class="bars">'+rec.map(function(p){
    var cls,tip;
    if(!p.ok){cls='f';tip=fmtT(p.t)+' · ❌ 失败';}
    else if(!pointGood(p)){cls='r';tip=fmtT(p.t)+' · 🟥 未达标 '+p.tls+'ms'+(p.speed!=null?' / '+p.speed+'KB/s':'');}
    else if(p.tls>H*0.8){cls='w';tip=fmtT(p.t)+' · ⚠️ '+p.tls+'ms（接近上限）'+(p.speed!=null?' · '+p.speed+'KB/s':'');}
    else{cls='g';tip=fmtT(p.t)+' · 🟩 达标 '+p.tls+'ms'+(p.speed!=null?' · '+p.speed+'KB/s':'');}
    return '<i class="'+cls+'" data-tip="'+esc(tip)+'"></i>';
  }).join('')+'</span>';
}
function getView(){
  var items=STATE.items.filter(function(i){
    if(TAB==='online')return i.latest&&i.latest.ok;
    if(TAB==='quality')return i.quality.quality;
    if(TAB==='offline')return !(i.latest&&i.latest.ok);
    return true; });
  var q=(el('fSearch').value||'').trim().toLowerCase();
  if(q)items=items.filter(function(i){return [i.label,i.ip,i.host,i.colo,i.loc].some(function(v){return v&&String(v).toLowerCase().indexOf(q)>=0;});});
  var fTls=parseFloat(el('fTls').value),fSp=parseFloat(el('fSpeed').value),fRate=parseFloat(el('fRate').value),fColo=el('fColo').value,fLoc=el('fLoc').value;
  if(!isNaN(fTls))items=items.filter(function(i){return i.quality.medTls!=null&&i.quality.medTls<=fTls;});
  if(!isNaN(fSp))items=items.filter(function(i){return i.quality.medSpeed!=null&&i.quality.medSpeed>=fSp;});
  if(!isNaN(fRate))items=items.filter(function(i){return i.quality.rate*100>=fRate;});
  if(fColo)items=items.filter(function(i){return (i.colo||'')===fColo;});
  if(fLoc)items=items.filter(function(i){return (i.loc||'')===fLoc;});
  var s=el('sortBy').value;
  items.sort(function(a,b){
    if(s==='speed')return (b.quality.medSpeed!=null?b.quality.medSpeed:-1)-(a.quality.medSpeed!=null?a.quality.medSpeed:-1);
    if(s==='rate')return b.quality.rate-a.quality.rate;
    return (a.quality.medTls!=null?a.quality.medTls:99999)-(b.quality.medTls!=null?b.quality.medTls:99999); });
  return items;
}
function lineOf(i){
  var cmt=[i.loc,i.colo,(i.quality.medTls!=null?i.quality.medTls+'ms':null),(i.quality.medSpeed!=null?i.quality.medSpeed+'KB/s':null)].filter(Boolean).join(' | ');
  return (i.ip||i.host)+':'+i.port+(cmt?'  #'+cmt:'');
}
function render(){
  try{
  if(!STATE||!STATE.items)return;
  var s=STATE;
  if(s.checking){
    var pct=s.progress.total?Math.round(s.progress.tested/s.progress.total*100):0;
    el('pwrap').classList.remove('hidden');
    el('pbar').style.width=pct+'%';
    el('ptext').innerText=s.progress.tested+'/'+s.progress.total;
    el('btnCheck').disabled=true;
    el('btnCheck').innerText='⏳ '+s.progress.tested+'/'+s.progress.total;
    el('cycleInfo').textContent='⏳ 检测中 '+s.progress.tested+'/'+s.progress.total+'（'+pct+'%）';
    el('cycleInfo').className='pill busy';
  }else{
    el('pwrap').classList.add('hidden');
    el('btnCheck').disabled=false;
    el('btnCheck').innerText='⚡ 立即检测';
    el('cycleInfo').textContent='上次 '+fmtT(s.lastCycle)+' · 每'+s.intervalSec+'s';
    el('cycleInfo').className='pill';
  }
  var crit=[];
  if(s.config.maxTlsMs>0)crit.push('TLS≤'+s.config.maxTlsMs);
  if(s.config.minSpeedKBps>0)crit.push('≥'+s.config.minSpeedKBps+'KB/s');
  var critStr=crit.length?crit.join(' · '):'仅要求成功';
  var need=Math.round(s.config.qualityRate*100);
  el('cfgInfo').textContent='优质 = 近'+s.config.qualityWindow+'次'+(need>=100?'全部达标':'≥'+need+'%达标')+'（'+critStr+'）';
  el('barsHead').textContent='近 '+s.config.qualityWindow+' 次状态';
  el('cards').innerHTML=
    '<div class="card"><div class="ic b">📦</div><div><b>'+s.summary.total+'</b><span>节点总数</span></div></div>'+
    '<div class="card ok"><div class="ic g">🟢</div><div><b>'+s.summary.online+'</b><span>当前在线</span></div></div>'+
    '<div class="card q"><div class="ic s">⭐</div><div><b>'+s.summary.quality+'</b><span>优质节点</span></div></div>'+
    '<div class="card off"><div class="ic r">🔻</div><div><b>'+s.summary.offline+'</b><span>离线 / 解析失败</span></div></div>';
  var cnt={all:s.items.length,online:s.summary.online,quality:s.summary.quality,offline:s.summary.offline};
  el('tabs').innerHTML=[['all','全部'],['online','在线'],['quality','优质'],['offline','离线']].map(function(t){
    return '<span class="tab'+(TAB===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+' '+cnt[t[0]]+'</span>'; }).join('');
  var colos={},locs={};
  s.items.forEach(function(i){if(i.colo)colos[i.colo]=1;if(i.loc)locs[i.loc]=1;});
  var cc=el('fColo').value,cl=el('fLoc').value;
  el('fColo').innerHTML='<option value="">全部</option>'+Object.keys(colos).sort().map(function(c){return '<option'+(c===cc?' selected':'')+'>'+c+'</option>';}).join('');
  el('fLoc').innerHTML='<option value="">全部</option>'+Object.keys(locs).sort().map(function(c){return '<option'+(c===cl?' selected':'')+'>'+c+'</option>';}).join('');
  LAST_VIEW=getView();
  el('filterCount').textContent=LAST_VIEW.length+' / '+s.items.length+' 个';
  if(!LAST_VIEW.length){el('list').innerHTML='<div class="empty">没有符合筛选条件的节点，等待检测或放宽筛选...</div>';return;}
  el('list').innerHTML=LAST_VIEW.map(function(i,idx){
    var on=i.latest&&i.latest.ok;
    var mbps=(i.latest&&i.latest.speed!=null)?(i.latest.speed*8/1000).toFixed(1):null;
    var badge=i.quality.quality?'<span class="badge q">优质</span>':(on?'<span class="badge on">在线</span>':'<span class="badge off">离线</span>');
    
    var kv='';
    if(i.isDomain&&i.ip)kv+='<span class="kv" title="域名解析到的真实测试 IP"><em>解析</em><b>'+esc(i.host)+' → '+esc(i.ip)+'</b></span>';
    if(i.colo)kv+='<span class="kv" title="Cloudflare 接入机房（colo）"><em>数据中心</em><b class="colo">'+esc(i.colo)+'</b></span>';
    if(i.loc)kv+='<span class="kv" title="节点出口地区（loc）"><em>地区</em><b>'+flag(i.loc)+' '+esc(i.loc)+'</b></span>';
    if(i.exitIp&&i.exitIp!==i.ip)kv+='<span class="kv" title="代理出口 IP（CF 看到的来源 IP）"><em>出口</em><b>'+esc(i.exitIp)+'</b></span>';
    if(i.latest&&i.latest.t)kv+='<span class="kv" title="最近一次检测完成时间"><em>最近检测</em><b class="time">'+fmtDT(i.latest.t)+'</b></span>';
    
    // 🌟 核心新增：离线原因高亮展示
    if (!on && i.latest && i.latest.failReason) {
      kv += '<span class="kv" title="节点被淘汰的具体原因"><em>淘汰原因</em><b class="err">'+esc(i.latest.failReason)+'</b></span>';
    }

    var ratePct=Math.round(i.quality.rate*100);
    var rateCls=ratePct>=80?'g':(ratePct>=50?'w':'r');
    return '<div class="row'+(i.quality.quality?' quality':'')+(on?'':' offline')+'">'+
      '<div class="main"><span class="dot '+(on?'on':'off')+'"></span><div class="who"><b>'+esc(i.label)+'</b><span class="subline">'+kv+'</span></div></div>'+
      '<div>'+barsHtml(i.recent)+'</div>'+
      '<div class="num">'+(i.quality.medTls!=null?i.quality.medTls+'<i>ms</i>':'--')+'</div>'+
      '<div class="num colhide">'+(on&&i.latest.tls!=null?i.latest.tls+'<i>ms</i>':'--')+'</div>'+
      '<div class="num colhide">'+(on&&i.latest.tcp!=null?i.latest.tcp+'<i>ms</i>':'--')+'</div>'+
      '<div class="num">'+(i.latest&&i.latest.speed!=null?i.latest.speed+'<i>KB/s</i>':'--')+'<small>'+(mbps?mbps+' Mbps':'')+'</small></div>'+
      '<div class="rate '+rateCls+'">'+ratePct+'%</div>'+
      '<div class="statcell"><button class="iconbtn" data-ci="'+idx+'" title="复制该节点">⧉</button>'+badge+'</div>'+
    '</div>';
  }).join('');
  }catch(e){ var c=el('cycleInfo'); c.textContent='渲染错误: '+e.message; c.className='pill busy'; }
}

var tipEl=el('tip');
document.addEventListener('mouseover',function(e){
  var b=e.target.closest?e.target.closest('[data-tip]'):null;
  if(b){ tipEl.innerText=b.getAttribute('data-tip'); tipEl.classList.add('show');
    var r=b.getBoundingClientRect();
    tipEl.style.left=Math.max(8,Math.min(window.innerWidth-280,r.left-20))+'px';
    tipEl.style.top=Math.max(8,r.top-38)+'px';
  } else tipEl.classList.remove('show');
});
window.addEventListener('scroll',function(){tipEl.classList.remove('show');},true);

function openLogs(){ el('logPanel').classList.remove('hidden'); pollLogs(); }
function pollLogs(){ if(el('logPanel').classList.contains('hidden'))return;
  fetch('/api/logs').then(function(r){return r.json();}).then(function(d){
    var c=el('console');
    c.innerHTML=(d.logs||[]).map(function(L){return '<div><span>'+fmtT(L.t)+'</span>'+esc(L.m)+'</div>';}).join('');
    c.scrollTop=c.scrollHeight;
  }).catch(function(){});
  setTimeout(pollLogs,2000);
}
el('btnLogs').onclick=openLogs;
el('logClose').onclick=function(){el('logPanel').classList.add('hidden');};
el('logPanel').addEventListener('click',function(e){if(e.target.id==='logPanel')el('logPanel').classList.add('hidden');});

document.addEventListener('click',function(e){
  var ci=e.target.closest('[data-ci]');
  if(ci){var it=LAST_VIEW[+ci.getAttribute('data-ci')];if(it){copyText(lineOf(it)).then(function(){toast('✅ 已复制 '+((it.ip||it.host)+':'+it.port));});}return;}
  var m=e.target.closest('[data-mtab]');
  if(m){document.querySelectorAll('.mtab').forEach(function(x){x.classList.toggle('on',x===m);});
    el('mCfg').classList.toggle('hidden',m.getAttribute('data-mtab')!=='cfg');
    el('mIps').classList.toggle('hidden',m.getAttribute('data-mtab')!=='ips');return;}
  var t=e.target.closest('[data-tab]');
  if(t){TAB=t.getAttribute('data-tab');render();}
});
el('btnCopy').onclick=function(){
  if(!LAST_VIEW.length){toast('当前没有可复制的节点',true);return;}
  copyText(LAST_VIEW.map(lineOf).join('\n')).then(function(){toast('✅ 已复制 '+LAST_VIEW.length+' 个节点（含注释）');});
};
el('btnSettings').onclick=openModal;
el('mClose').onclick=function(){el('modal').classList.add('hidden');};
el('modal').addEventListener('click',function(e){if(e.target.id==='modal')el('modal').classList.add('hidden');});
el('saveCfg').onclick=function(){
  var body={intervalSec:+el('cInterval').value,timeoutSec:+el('cTimeout').value,concurrency:+el('cConcurrency').value,
    dnsTtlSec:+el('cDnsTtl').value,retainHours:+el('cRetain').value,probeUrl:el('cProbe').value,customProbeUrl:el('cCustomProbe').value,
    maxTlsMs:+el('cMaxTls').value,minSpeedKBps:+el('cMinSpeed').value,qualityWindow:+el('cWindow').value,qualityRate:+el('cRate').value,
    github:{token:el('cGhToken').value,repo:el('cGhRepo').value,path:el('cGhPath').value,branch:el('cGhBranch').value,auto:el('cGhAuto').checked}};
  fetch('/api/config',{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(r){
    if(r.ok)toast('✅ 配置已保存并生效');else toast(r.error||'保存失败',true); load();
  }).catch(function(e){toast(e.message,true);});
};
el('saveIps').onclick=function(){
  fetch('/api/ipfile',{method:'POST',body:JSON.stringify({content:el('ipText').value})}).then(function(r){return r.json();}).then(function(r){
    if(r.ok)toast('✅ 已保存 ip.txt，展开为 '+r.count+' 个测试单元');else toast(r.error||'保存失败',true); load();
  }).catch(function(e){toast(e.message,true);});
};
['fTls','fSpeed','fRate','fColo','fLoc','sortBy','fSearch'].forEach(function(id){el(id).addEventListener('input',render);});
el('fReset').onclick=function(){['fTls','fSpeed','fRate','fSearch'].forEach(function(id){el(id).value='';});el('fColo').value='';el('fLoc').value='';render();};
el('btnCheck').onclick=function(){fetch('/api/check',{method:'POST'});toast('⚡ 已触发检测');setTimeout(load,600);};
el('btnUpload').onclick=function(){
  if(!STATE||!STATE.github.configured){toast('未配置 GitHub（设置 → Token/仓库）',true);return;}
  var b=el('btnUpload');b.disabled=true;
  fetch('/api/upload',{method:'POST'}).then(function(r){return r.json();}).then(function(r){
    if(r.ok)toast('✅ 已上传 '+r.count+' 个优质节点');else toast(r.error||'上传失败',true);
    b.disabled=false;load();
  }).catch(function(e){toast(e.message,true);b.disabled=false;});
};
function openModal(){
  el('modal').classList.remove('hidden');
  Promise.all([fetch('/api/config').then(function(r){return r.json();}),fetch('/api/ipfile').then(function(r){return r.json();})]).then(function(arr){
    var c=arr[0],ipf=arr[1];
    el('cInterval').value=c.intervalSec;el('cTimeout').value=c.timeoutSec;el('cConcurrency').value=c.concurrency;
    el('cDnsTtl').value=c.dnsTtlSec;el('cRetain').value=c.retainHours;el('cProbe').value=c.probeUrl;el('cCustomProbe').value=c.customProbeUrl||'';
    el('cMaxTls').value=c.maxTlsMs;el('cMinSpeed').value=c.minSpeedKBps;el('cWindow').value=c.qualityWindow;el('cRate').value=c.qualityRate;
    el('cGhToken').value=c.github.token;el('cGhRepo').value=c.github.repo;el('cGhPath').value=c.github.path;el('cGhBranch').value=c.github.branch;el('cGhAuto').checked=!!c.github.auto;
    el('ipText').value=ipf.content||'';
  }).catch(function(e){toast('打开设置失败: '+e.message,true);});
}
load();setInterval(load,3000);
})();
</script>
</body>
</html>
