<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Monitor v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-online { background-color: #10b981; }
        .status-offline { background-color: #ef4444; }
        .status-checking { background-color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="app" class="container mx-auto px-4 py-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-400">🚀 Proxy Monitor <span class="text-sm text-gray-400">v2.0.0</span></h1>
            <div class="space-x-2">
                <button onclick="checkNow()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition">立即检测</button>
                <button onclick="abortCheck()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition">中断</button>
                <button onclick="uploadToGithub()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg transition">上传 GitHub</button>
            </div>
        </header>

        <!-- Status Bar -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">总节点数</div>
                <div class="text-2xl font-bold" id="totalNodes">0</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">在线节点</div>
                <div class="text-2xl font-bold text-green-400" id="onlineNodes">0</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">检测状态</div>
                <div class="text-2xl font-bold" id="checkStatus">空闲</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">上次检测</div>
                <div class="text-lg" id="lastCycle">-</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div id="progressBar" class="hidden mb-6">
            <div class="bg-gray-800 rounded-full h-4 overflow-hidden">
                <div id="progressFill" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="text-center mt-2 text-sm text-gray-400">
                <span id="progressText">0 / 0</span>
            </div>
        </div>

        <!-- Tabs -->
        <div class="mb-4 border-b border-gray-700">
            <nav class="-mb-px flex space-x-8">
                <button onclick="switchTab('nodes')" class="tab-btn active border-blue-500 text-blue-400 whitespace-nowrap py-4 px-1 border-b-2 font-medium">节点列表</button>
                <button onclick="switchTab('graveyard')" class="tab-btn border-transparent text-gray-400 hover:text-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium">墓地</button>
                <button onclick="switchTab('config')" class="tab-btn border-transparent text-gray-400 hover:text-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium">配置</button>
                <button onclick="switchTab('logs')" class="tab-btn border-transparent text-gray-400 hover:text-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium">日志</button>
            </nav>
        </div>

        <!-- Tab Contents -->
        <div id="tab-nodes" class="tab-content">
            <div class="flex justify-between mb-4">
                <input type="text" id="searchInput" placeholder="搜索 IP..." class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 w-64" oninput="filterNodes()">
                <div class="space-x-2">
                    <button onclick="speedTestSelected()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition">测速选中</button>
                    <button onclick="removeSelected()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition">删除选中</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="p-3"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                            <th class="p-3">IP</th>
                            <th class="p-3">端口</th>
                            <th class="p-3">位置</th>
                            <th class="p-3">延迟 (ms)</th>
                            <th class="p-3">速度 (Mbps)</th>
                            <th class="p-3">状态</th>
                            <th class="p-3">最后在线</th>
                        </tr>
                    </thead>
                    <tbody id="nodesTable"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-graveyard" class="tab-content hidden">
            <div class="flex justify-between mb-4">
                <h2 class="text-xl font-bold">墓地列表</h2>
                <button onclick="clearGraveyard()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition">清空墓地</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="p-3">IP</th>
                            <th class="p-3">端口</th>
                            <th class="p-3">原因</th>
                            <th class="p-3">时间</th>
                            <th class="p-3">操作</th>
                        </tr>
                    </thead>
                    <tbody id="graveyardTable"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-config" class="tab-content hidden">
            <div class="bg-gray-800 p-6 rounded-lg max-w-2xl">
                <h2 class="text-xl font-bold mb-4">系统配置</h2>
                <form id="configForm" onsubmit="saveConfig(event)">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">检测间隔 (秒)</label>
                            <input type="number" id="cfg_intervalSec" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">并发数</label>
                            <input type="number" id="cfg_concurrency" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">超时 (秒)</label>
                            <input type="number" id="cfg_timeoutSec" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">启用测速</label>
                            <select id="cfg_speedEnabled" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                                <option value="true">是</option>
                                <option value="false">否</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">探针 URL</label>
                            <input type="text" id="cfg_probeUrl" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">测速 URL</label>
                            <input type="text" id="cfg_speedUrl" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">GitHub 仓库</label>
                            <input type="text" id="cfg_githubRepo" placeholder="user/repo" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                        </div>
                    </div>
                    <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg transition">保存配置</button>
                </form>
            </div>
        </div>

        <div id="tab-logs" class="tab-content hidden">
            <div class="bg-gray-800 p-4 rounded-lg h-96 overflow-y-auto font-mono text-sm" id="logsContainer"></div>
        </div>
    </div>

    <script>
        let state = {};
        let selectedNodes = new Set();
        let currentTab = 'nodes';

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                state = await res.json();
                updateUI();
            } catch (e) {
                console.error('Failed to fetch state:', e);
            }
        }

        function updateUI() {
            document.getElementById('totalNodes').textContent = Object.keys(state.nodes || {}).length;
            document.getElementById('onlineNodes').textContent = Object.keys(state.history || {}).length;
            document.getElementById('checkStatus').textContent = state.checking ? '检测中...' : '空闲';
            document.getElementById('checkStatus').className = state.checking ? 'text-2xl font-bold text-yellow-400' : 'text-2xl font-bold text-green-400';
            if (state.lastCycle) document.getElementById('lastCycle').textContent = new Date(state.lastCycle).toLocaleString();

            if (state.checking && state.progress) {
                document.getElementById('progressBar').classList.remove('hidden');
                const pct = state.progress.total > 0 ? (state.progress.tested / state.progress.total * 100) : 0;
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('progressText').textContent = `${state.progress.tested} / ${state.progress.total}`;
            } else {
                document.getElementById('progressBar').classList.add('hidden');
            }

            if (currentTab === 'nodes') updateNodesTable();
            if (currentTab === 'graveyard') updateGraveyardTable();
            if (currentTab === 'logs') updateLogs();
        }

        function updateNodesTable() {
            const nodes = state.nodes || {};
            const history = state.history || {};
            const speed = state.speed || {};
            document.getElementById('nodesTable').innerHTML = Object.values(nodes).map(node => {
                const hist = history[node.id]?.slice(-1)[0];
                const spd = speed[node.id];
                return `<tr class="border-b border-gray-700 hover:bg-gray-800">
                    <td class="p-3"><input type="checkbox" data-id="${node.id}" onchange="toggleNode('${node.id}')"></td>
                    <td class="p-3 font-mono">${node.ip}</td>
                    <td class="p-3">${node.port}</td>
                    <td class="p-3">${hist?.colo || '-'}</td>
                    <td class="p-3">${hist?.off?.total || '-'}</td>
                    <td class="p-3 ${spd?.ok ? 'text-green-400' : 'text-gray-500'}">${spd?.ok ? spd.mbps?.toFixed(2) : '-'}</td>
                    <td class="p-3"><span class="status-online w-3 h-3 rounded-full inline-block"></span></td>
                    <td class="p-3 text-sm text-gray-400">${node.lastOnlineAt ? new Date(node.lastOnlineAt).toLocaleString() : '-'}</td>
                </tr>`;
            }).join('');
        }

        function updateGraveyardTable() {
            const graveyard = state.graveyard?.list || [];
            document.getElementById('graveyardTable').innerHTML = graveyard.map(entry => `
                <tr class="border-b border-gray-700 hover:bg-gray-800">
                    <td class="p-3 font-mono">${entry.ip}</td>
                    <td class="p-3">${entry.port}</td>
                    <td class="p-3 text-red-400">${entry.reason}</td>
                    <td class="p-3 text-sm text-gray-400">${new Date(entry.t).toLocaleString()}</td>
                    <td class="p-3"><button onclick="unblockNode('${entry.id}')" class="text-blue-400 hover:text-blue-300">解封</button></td>
                </tr>`).join('');
        }

        function updateLogs() {
            document.getElementById('logsContainer').innerHTML = (state.logs || []).map(log => `<div class="text-gray-300">${log}</div>`).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'border-blue-500', 'text-blue-400');
                btn.classList.add('border-transparent', 'text-gray-400');
            });
            event.target.classList.add('active', 'border-blue-500', 'text-blue-400');
            event.target.classList.remove('border-transparent', 'text-gray-400');
            updateUI();
        }

        async function checkNow() { await fetch('/api/check', { method: 'POST' }); fetchState(); }
        async function abortCheck() { await fetch('/api/abort', { method: 'POST' }); fetchState(); }
        async function uploadToGithub() { const res = await fetch('/api/upload', { method: 'POST' }); const data = await res.json(); alert(data.ok ? '上传成功!' : '上传失败：' + (data.error || '未知错误')); }
        async function clearGraveyard() { if (!confirm('确定要清空墓地吗?')) return; await fetch('/api/graveyard/clear', { method: 'POST' }); fetchState(); }
        async function unblockNode(id) { await fetch('/api/graveyard/unblock', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ ids: [id] }) }); fetchState(); }

        async function saveConfig(e) {
            e.preventDefault();
            const config = {
                intervalSec: parseInt(document.getElementById('cfg_intervalSec').value),
                concurrency: parseInt(document.getElementById('cfg_concurrency').value),
                timeoutSec: parseInt(document.getElementById('cfg_timeoutSec').value),
                speedEnabled: document.getElementById('cfg_speedEnabled').value === 'true',
                probeUrl: document.getElementById('cfg_probeUrl').value,
                speedUrl: document.getElementById('cfg_speedUrl').value,
                githubRepo: document.getElementById('cfg_githubRepo').value
            };
            await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config) });
            alert('配置已保存');
            loadConfig();
        }

        async function loadConfig() {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            document.getElementById('cfg_intervalSec').value = cfg.intervalSec || 60;
            document.getElementById('cfg_concurrency').value = cfg.concurrency || 50;
            document.getElementById('cfg_timeoutSec').value = cfg.timeoutSec || 5;
            document.getElementById('cfg_speedEnabled').value = cfg.speedEnabled ? 'true' : 'false';
            document.getElementById('cfg_probeUrl').value = cfg.probeUrl || '';
            document.getElementById('cfg_speedUrl').value = cfg.speedUrl || '';
            document.getElementById('cfg_githubRepo').value = cfg.githubRepo || '';
        }

        function toggleNode(id) { if (selectedNodes.has(id)) selectedNodes.delete(id); else selectedNodes.add(id); }
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('#nodesTable input[type="checkbox"][data-id]');
            const selectAll = document.getElementById('selectAll').checked;
            checkboxes.forEach(cb => { cb.checked = selectAll; if (selectAll) selectedNodes.add(cb.dataset.id); else selectedNodes.delete(cb.dataset.id); });
        }
        async function removeSelected() { if (selectedNodes.size === 0) return alert('请先选择节点'); if (!confirm(`确定要删除选中的 ${selectedNodes.size} 个节点吗?`)) return; await fetch('/api/remove', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ ids: Array.from(selectedNodes) }) }); selectedNodes.clear(); fetchState(); }
        async function speedTestSelected() { if (selectedNodes.size === 0) return alert('请先选择节点'); await fetch('/api/speedtest', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ ids: Array.from(selectedNodes).slice(0, 10) }) }); fetchState(); }
        function filterNodes() { const search = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('#nodesTable tr').forEach(row => { const ip = row.cells[1]?.textContent.toLowerCase() || ''; row.style.display = ip.includes(search) ? '' : 'none'; }); }

        setInterval(fetchState, 3000);
        fetchState();
        loadConfig();
    </script>
</body>
</html>
