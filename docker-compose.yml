version: '3.8'

services:
  proxy-monitor:
    build: .
    container_name: proxy-monitor
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - INTERVAL_SEC=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
