services:
  proxy-monitor:
    image: coldicy7/proxyip-monitor:latest
    container_name: proxy-monitor
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - TZ=Asia/Shanghai
      # 可选：通过环境变量配置 GitHub Token（推荐方式）
      # - GITHUB_TOKEN=your_github_token_here
    volumes:
      - ./proxy-monitor/config:/app/config:rw  # 配置文件目录
      - ./proxy-monitor/data:/app/data:rw      # 数据目录
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/state"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"